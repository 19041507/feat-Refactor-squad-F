<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portfólio</title>
    <link rel="stylesheet" href="contato.css">
</head>
<body>

    <header class="site-header">
        <div class="logo"></div>

        <nav class="main-nav">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="habilidades.html">Habilidades</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="depoimentos.html">Depoimentos</a></li>
                <li><a href="case-de-sucesso.html">Case de Sucesso</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="section-projetos-intro">
            <h2>Vamos Conversar?</h2>
            <p>Tem um projeto em mente ou quer tirar uma dúvida? Preencha o formulário abaixo.</p>
        </section>

        <section class="form-section">
            <div class="project-card">
                <form action="mailto:seuemail@exemplo.com" method="post" enctype="text/plain">

                    <div>
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                    </div>

                    <div>
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                    </div>

                    <div>
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Como podemos ajudar?"></textarea>
                    </div>

                    <button type="submit">Enviar Mensagem</button>

                </form>
            </div>
        </section>

    </main>

    <footer>
        <p>Todos os direitos reservados | 2025</p>
    </footer>

</body>
</html>
